version: "3.8"

services:
  backend:
    build:
      context: ./medicare-backend
      dockerfile: Dockerfile
    container_name: medicore-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=production-medicore-secure-secret-key-32-chars
      - CLIENT_URL=http://localhost:5173
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/serviceAccountKey.json
    volumes:
      - ./medicare-backend/serviceAccountKey.json:/app/serviceAccountKey.json:ro
    networks:
      - medicore-network

  frontend:
    build:
      context: ./medicare-frontend
      dockerfile: Dockerfile
    container_name: medicore-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - medicore-network

networks:
  medicore-network:
    driver: bridge
