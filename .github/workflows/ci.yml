name: MediCore Continuous Integration (CI)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. FRONTEND CI: Linting, Formatting & Production Bundle Build
  # =========================================================================
  frontend-ci:
    name: Frontend Quality & Build Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medicare-frontend

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: medicare-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint Code Quality Checks
        run: npm run lint

      - name: Build Production Vite Bundle
        run: npm run build

      - name: Verify SEO & Static Assets
        run: |
          test -f dist/index.html || exit 1
          test -f dist/robots.txt || exit 1
          test -f dist/sitemap.xml || exit 1
          echo "✓ Production bundle and SEO assets verified successfully."

  # =========================================================================
  # 2. BACKEND CI: Unit & Integration Test Suite + Security Regressions
  # =========================================================================
  backend-ci:
    name: Backend API & Security Regression Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medicare-backend

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: medicare-backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Execute Automated Test Suite
        env:
          PORT: 5000
          NODE_ENV: test
          JWT_SECRET: ci-temporary-random-secret-key-32-chars-long
          CLIENT_URL: http://localhost:5173
        run: npm test

  # =========================================================================
  # 3. SECURITY & AUDIT SCAN
  # =========================================================================
  security-audit:
    name: Automated Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit Backend Dependencies
        working-directory: medicare-backend
        run: npm audit --audit-level=critical || true

      - name: Audit Frontend Dependencies
        working-directory: medicare-frontend
        run: npm audit --audit-level=critical || true
