<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Metadata -->
    <title>MediCore Healthcare | Modern Clinical Management & Specialist Consultations</title>
    <meta
      name="description"
      content="MediCore is an integrated digital healthcare platform for real-time specialist consultation booking, patient queue tracking, and encrypted electronic health records."
    />
    <meta
      name="keywords"
      content="healthcare platform, book doctor online, clinical appointments, specialist consultation, cardiology, pediatrics, neurology, medical records, hospital management"
    />
    <meta name="author" content="MediCore Healthcare Systems" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://medicore.health/" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="color-scheme" content="light dark" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph (Facebook / LinkedIn / Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://medicore.health/" />
    <meta property="og:site_name" content="MediCore Healthcare" />
    <meta property="og:title" content="MediCore Healthcare | Modern Clinical Management & Specialist Consultations" />
    <meta
      property="og:description"
      content="Connect with certified medical specialists, schedule clinical appointments in real-time, and securely manage your electronic health records."
    />
    <meta property="og:image" content="https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&w=1200&h=630&q=80" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MediCore Modern Healthcare Facility" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MediCore Healthcare | Specialist Consultations & Patient Care" />
    <meta
      name="twitter:description"
      content="Book appointments with top medical specialists with zero wait times. Secure, certified, and 24/7 accessible."
    />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&w=1200&h=630&q=80" />

    <!-- Preconnect for Performance Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured Data: Organization & Hospital (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MedicalOrganization",
        "name": "MediCore Healthcare System",
        "alternateName": "MediCore",
        "url": "https://medicore.health",
        "logo": "https://medicore.health/favicon.svg",
        "description": "Comprehensive digital healthcare management platform offering verified outpatient consultations across multiple clinical specialties.",
        "telephone": "+94-11-234-5678",
        "email": "care@medicore.health",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "No. 120, Healthcare Avenue",
          "addressLocality": "Colombo 07",
          "addressRegion": "Western Province",
          "postalCode": "00700",
          "addressCountry": "LK"
        },
        "medicalSpecialty": [
          "Cardiovascular",
          "Pediatric",
          "Neurology",
          "Orthopedic",
          "GeneralPractice"
        ],
        "availableService": {
          "@type": "MedicalTherapy",
          "name": "Specialist Consultation & Outpatient Appointments"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
